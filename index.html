<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/planets_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Showcase</title>
    <meta
      name="description"
      content="A random photo from NASA's archive, explained out loud by a cosmic scientist."
    />

    <!-- Social cards. Absolute URLs are required: scrapers fetch the image
         without a page context, so a relative path resolves to nothing and the
         link renders as a bare grey placeholder. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Space Showcase" />
    <meta property="og:title" content="Space Showcase" />
    <meta
      property="og:description"
      content="A random photo from NASA's archive, explained out loud by a cosmic scientist."
    />
    <meta property="og:url" content="https://space-showcase.vercel.app/" />
    <meta property="og:image" content="https://space-showcase.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Space Showcase, with its puppet scientist against a starfield." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Space Showcase" />
    <meta
      name="twitter:description"
      content="A random photo from NASA's archive, explained out loud by a cosmic scientist."
    />
    <meta name="twitter:image" content="https://space-showcase.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
